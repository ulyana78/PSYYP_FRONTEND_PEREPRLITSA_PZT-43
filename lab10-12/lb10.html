    <script>
        // исходный массив из 6 целых элементов
        let arr = [12, 5, 8, 23, 42, 17];
        let initialArr = [...arr]; 
        
        // поиск суммы четных элементов
        let sumEven = 0;
        for(let num of arr) { 
            if(num % 2 === 0) sumEven += num; 
        }
        
        // сортировка элементов массива по убыванию
        arr.sort(function(a, b) {
            return b - a;
        });

        // Вывод результатов
        document.write("<p>Исходный массив: " + initialArr.join(", ") + "<br>");
        document.write("<p>Сумма четных элементов: " + sumEven + "<br>");
        document.write("Измененный массив (по убыванию): " + arr.join(", ") + "</p>");
    </script>
